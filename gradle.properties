group = com.algorist.erdmaid

pluginRepositoryUrl = https://github.com/luceat-lux-vestra/erdMaid

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# The 2026.2 SDK excluded the unrelated Java bundle because its startup
# extensions failed under the flat test classpath. The 2026.3 platform moved
# test-framework FileComparisonData into Java's plugins/java/lib/idea_rt.jar.
# Retain only the existing unrelated platform exclusions and let IJPGP 2.20.1
# load the Java plugin's published runtime, rather than stubbing missing
# test-framework classes or weakening the IDE integration tests. DatabaseTools
# remains an explicit production dependency in build.gradle.kts.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes = com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh

# Disable Gradle Configuration Cache because the plugin version is timestamp-based by default.
org.gradle.configuration-cache = false

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
