group = com.algorist.erdmaid

pluginRepositoryUrl = https://github.com/luceat-lux-vestra/erdMaid-public

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# IJPGP 2.18.1 adds every product-info bundled plugin to TestIdeTask's flat
# classpath by default. IntelliJ IDEA 2026.2's unrelated bundled Java plugin
# currently fails during action registration before erdMaid tests can execute.
# Preserve IJPGP's defaults and exclude only Java from that automatic flat
# classpath. erdMaid's required com.intellij.database plugin remains an explicit
# bundledPlugins dependency in build.gradle.kts and must never be added here.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes = com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh,com.intellij.java

# Disable Gradle Configuration Cache because the plugin version is timestamp-based by default.
org.gradle.configuration-cache = false

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
