# Pull request and `main` validation for the erdMaid plugin.
#
# This workflow is validation only. It must never mutate repository state
# (releases, tags, labels, branches). Release execution, if it is ever
# reintroduced, belongs in a separate workflow behind a separate trigger.
#
# Third-party actions are pinned to immutable full-length commit SHAs. The
# trailing `# vX.Y.Z` comment is what lets Dependabot keep the pin current;
# do not remove it and do not replace a SHA with a tag.

name: Build

on:
  # Pushes to `main` only, so Dependabot branches are not validated twice.
  push:
    branches: [ main ]
  pull_request:

# Least privilege by default. Jobs that need more must opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Compile the plugin and publish the packaged distribution as an artifact.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build plugin
        run: ./gradlew buildPlugin

      # Unpack the distribution so the uploaded artifact is browsable.
      - name: Prepare Plugin Artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/distributions"
          FILENAME=$(ls -- *.zip)
          unzip -q "$FILENAME" -d content
          echo "filename=${FILENAME%.zip}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*
          if-no-files-found: error

  # Authoritative test gate.
  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # IJPGP 2.18.1 has a known intermittent jar FileSystem lifecycle bug while
      # resolving bundled plugins. The gate retries exactly once only when the
      # complete command-specific ClosedFileSystemException signature is present;
      # every other failure remains an immediate failure.
      - name: Run Tests
        run: python3 scripts/gradle_check_gate.py check

      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-result
          path: build/reports/tests
          if-no-files-found: warn

  # Authoritative plugin structure + IntelliJ Plugin Verifier gate.
  #
  # `tool-cache` and `large-packages` reclamation are enabled here (and only
  # here) because the Verifier downloads full IDE distributions plus their
  # Marketplace dependencies. Every `Verify plugin` run on `main` between
  # 2026-08-05 and 2026-08-27 failed with "No space left on device" without it.
  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          large-packages: true

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # Verification targets are declared explicitly in build.gradle.kts.
      # The same IJPGP 2.18.1 zipfs race can happen before the Plugin Verifier
      # starts, while resolving :compileClasspath. Real verifier findings never
      # satisfy the exact upstream signature and therefore are never retried.
      - name: Run Plugin Verification tasks
        run: python3 scripts/gradle_check_gate.py verifyPlugin

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pluginVerifier-result
          path: build/reports/pluginVerifier
          if-no-files-found: warn
