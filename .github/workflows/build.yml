# Pull request and `main` validation for the erdMaid plugin.
#
# This workflow is validation only. It must never mutate repository state
# (releases, tags, labels, branches). Release execution, if it is ever
# reintroduced, belongs in a separate workflow behind a separate trigger.
#
# Third-party actions are pinned to immutable full-length commit SHAs. The
# trailing `# vX.Y.Z` comment is what lets Dependabot keep the pin current;
# do not remove it and do not replace a SHA with a tag.

name: Build

on:
  # Pushes to `main` only, so Dependabot branches are not validated twice.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege by default. Jobs that need more must opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  scope:
    name: Validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Detect documentation-only scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.json"

          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty or unreadable; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            [ .[][] | .filename ] as $files
            | all($files[];
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

  # Compile the plugin and publish the packaged distribution as an artifact.
  build:
    name: Build
    needs: [ scope ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # Needed to inspect the canonical exact-SHA Build workflow run.
      contents: read
    steps:
      - name: Documentation-only fast path
        if: ${{ needs.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; product Build is not applicable."

      - name: Reuse exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ needs.scope.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: Build
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR cannot reuse base-repository Build evidence; Final will execute the local Fast checks."
            exit 0
          fi
          base_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build.yml?ref=$BASE_SHA" --jq '.sha')"
          head_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build.yml?ref=$EXPECTED_SHA" --jq '.sha')"
          if [ "$base_workflow_sha" != "$head_workflow_sha" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Build producer workflow changed on this PR; Final will execute the local Fast checks instead of trusting self-modified evidence."
            exit 0
          fi

          for _ in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=pull_request&head_sha=$EXPECTED_SHA&per_page=100")"
            latest="$(jq -c --arg sha "$EXPECTED_SHA" --arg current "$GITHUB_RUN_ID" '
              [.workflow_runs[]
               | select(.head_sha == $sha and .event == "pull_request")
               | select((.id | tostring) != $current)]
              | if length == 0 then empty else max_by(.id) end
            ' <<<"$runs")"
            if [ -z "$latest" ]; then
              sleep 5
              continue
            fi
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" != "completed" ]; then
              sleep 5
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::Canonical Build workflow for exact HEAD $EXPECTED_SHA concluded '$conclusion'; refusing stale or failed evidence."
              exit 1
            fi

            run_id="$(jq -r '.id' <<<"$latest")"
            jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
            matching_jobs="$(jq --arg name "$EXPECTED_JOB" '[.jobs[] | select(.name == $name)] | length' <<<"$jobs")"
            if [ "$matching_jobs" != "1" ]; then
              echo "::error::Canonical Build run $run_id must contain exactly one '$EXPECTED_JOB' job; found $matching_jobs."
              exit 1
            fi
            job_status="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | .status' <<<"$jobs")"
            job_conclusion="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | (.conclusion // "")' <<<"$jobs")"
            if [ "$job_status" != "completed" ] || [ "$job_conclusion" != "success" ]; then
              echo "::error::Canonical '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA is status=$job_status conclusion=$job_conclusion."
              exit 1
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing canonical successful '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA."
            exit 0
          done
          echo "::error::Timed out waiting for canonical exact-SHA '$EXPECTED_JOB' evidence at $EXPECTED_SHA."
          exit 1

      - name: Maximize Build Space
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          swap-storage: true
          large-packages: false

      - name: Fetch Sources
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build plugin
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: ./gradlew buildPlugin

      # Unpack the distribution so the uploaded artifact is browsable.
      - name: Prepare Plugin Artifact
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/distributions"
          FILENAME=$(ls -- *.zip)
          unzip -q "$FILENAME" -d content
          echo "filename=${FILENAME%.zip}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*
          if-no-files-found: error

  # Authoritative test gate.
  test:
    name: Test
    needs: [ scope, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # Needed to inspect the canonical exact-SHA Build workflow run.
      contents: read
    steps:
      - name: Documentation-only fast path
        if: ${{ needs.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; product Test is not applicable."

      - name: Reuse exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ needs.scope.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: Test
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR cannot reuse base-repository Build evidence; Final will execute the local Fast checks."
            exit 0
          fi
          base_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build.yml?ref=$BASE_SHA" --jq '.sha')"
          head_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build.yml?ref=$EXPECTED_SHA" --jq '.sha')"
          if [ "$base_workflow_sha" != "$head_workflow_sha" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Build producer workflow changed on this PR; Final will execute the local Fast checks instead of trusting self-modified evidence."
            exit 0
          fi

          for _ in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=pull_request&head_sha=$EXPECTED_SHA&per_page=100")"
            latest="$(jq -c --arg sha "$EXPECTED_SHA" --arg current "$GITHUB_RUN_ID" '
              [.workflow_runs[]
               | select(.head_sha == $sha and .event == "pull_request")
               | select((.id | tostring) != $current)]
              | if length == 0 then empty else max_by(.id) end
            ' <<<"$runs")"
            if [ -z "$latest" ]; then
              sleep 5
              continue
            fi
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" != "completed" ]; then
              sleep 5
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::Canonical Build workflow for exact HEAD $EXPECTED_SHA concluded '$conclusion'; refusing stale or failed evidence."
              exit 1
            fi

            run_id="$(jq -r '.id' <<<"$latest")"
            jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
            matching_jobs="$(jq --arg name "$EXPECTED_JOB" '[.jobs[] | select(.name == $name)] | length' <<<"$jobs")"
            if [ "$matching_jobs" != "1" ]; then
              echo "::error::Canonical Build run $run_id must contain exactly one '$EXPECTED_JOB' job; found $matching_jobs."
              exit 1
            fi
            job_status="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | .status' <<<"$jobs")"
            job_conclusion="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | (.conclusion // "")' <<<"$jobs")"
            if [ "$job_status" != "completed" ] || [ "$job_conclusion" != "success" ]; then
              echo "::error::Canonical '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA is status=$job_status conclusion=$job_conclusion."
              exit 1
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing canonical successful '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA."
            exit 0
          done
          echo "::error::Timed out waiting for canonical exact-SHA '$EXPECTED_JOB' evidence at $EXPECTED_SHA."
          exit 1

      - name: Maximize Build Space
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          swap-storage: true
          large-packages: false

      - name: Fetch Sources
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # IJPGP 2.18.1 has a known intermittent jar FileSystem lifecycle bug while
      # resolving bundled plugins. The gate retries exactly once only when the
      # complete command-specific ClosedFileSystemException signature is present;
      # every other failure remains an immediate failure.
      - name: Run Tests
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: python3 scripts/gradle_check_gate.py check

      - name: Show large-workload proof evidence
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== large-selection ==='
          cat build/reports/proof/large-selection.txt
          echo '=== large-selection-cancelled ==='
          cat build/reports/proof/large-selection-cancelled.txt

      # #79 grammar evidence is CI-only. The plugin runtime and Gradle graph do
      # not depend on Node/npm/Mermaid. The exact published Mermaid package is
      # downloaded only after production fixture binding has passed above; its
      # prebuilt ESM parser bundle is executed directly without npm install.
      - name: Setup Node for Mermaid grammar evidence
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.9.0'

      - name: Verify Mermaid 11.17.2 grammar evidence
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        env:
          MERMAID_VERSION: 11.17.2
          MERMAID_INTEGRITY: sha512-V6K3C8EBdEsPFZXSKMJe6ppQOENxuHARr9GvHX4hh47lAbhMRD9qf4oEK7LoaRQxULMa80/qt5gHO73aCleBBg==
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="$RUNNER_TEMP/mermaid-grammar"
          rm -rf "$EVIDENCE_ROOT"
          mkdir -p "$EVIDENCE_ROOT"
          PACKAGE_FILE=$(npm pack --silent --ignore-scripts --pack-destination "$EVIDENCE_ROOT" "mermaid@${MERMAID_VERSION}")
          test -n "$PACKAGE_FILE"
          PACKAGE_PATH="$EVIDENCE_ROOT/$PACKAGE_FILE"
          ACTUAL_INTEGRITY="sha512-$(node -e 'const fs=require("node:fs"); const crypto=require("node:crypto"); const data=fs.readFileSync(process.argv[1]); process.stdout.write(crypto.createHash("sha512").update(data).digest("base64"));' "$PACKAGE_PATH")"
          if [ "$ACTUAL_INTEGRITY" != "$MERMAID_INTEGRITY" ]; then
            echo "::error::Mermaid package integrity mismatch: expected $MERMAID_INTEGRITY, observed $ACTUAL_INTEGRITY"
            exit 1
          fi
          echo "Mermaid package integrity OK: $ACTUAL_INTEGRITY"
          tar -xzf "$PACKAGE_PATH" -C "$EVIDENCE_ROOT"
          node scripts/verify_mermaid_grammar.mjs \
            "$EVIDENCE_ROOT/package" \
            "$GITHUB_WORKSPACE/src/test/resources/mermaid"

      - name: Collect Tests Result
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-result
          path: build/reports/tests
          if-no-files-found: warn

  # Authoritative plugin structure + IntelliJ Plugin Verifier gate.
  #
  # `tool-cache` and `large-packages` reclamation are enabled here (and only
  # here) because the Verifier downloads full IDE distributions plus their
  # Marketplace dependencies. Every `Verify plugin` run on `main` between
  # 2026-08-05 and 2026-08-27 failed with "No space left on device" without it.
  #
  # One required job owns both supported hosts on the 2026.2 platform line.
  # IntelliJ IDEA runs via IJPGP's verifyPlugin task; DataGrip runs through the
  # pinned standalone gate because IJPGP 2.18.1 still has the DB/DG catalog-code
  # mismatch. Either step failing fails this same required context.
  verify:
    name: Verify plugin
    needs: [ scope, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Documentation-only fast path
        if: ${{ needs.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; Plugin Verifier is not applicable."


      - name: Maximize Build Space
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: true
          swap-storage: true
          large-packages: true

      - name: Fetch Sources
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # The IJPGP-owned IntelliJ IDEA 2026.2.2 target is declared explicitly in
      # build.gradle.kts. The known IJPGP zipfs race can happen before Plugin
      # Verifier starts; real verifier findings never satisfy the exact retry
      # signature.
      - name: Verify IntelliJ IDEA compatibility
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        run: python3 scripts/gradle_check_gate.py verifyPlugin

      # DataGrip 2026.2.5 intentionally does not go through IJPGP's broken native
      # resolver. This step selects that exact release/build, verifies archive
      # identity/checksums and a pinned Plugin Verifier JAR, then enforces the
      # same default blocking levels as IJPGP 2.18.1. It has no retry path.
      - name: Verify DataGrip compatibility
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        run: python3 scripts/datagrip_verifier.py

      - name: Collect Plugin Verifier Result
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pluginVerifier-result
          path: |
            build/reports/pluginVerifier
            build/reports/pluginVerifierDataGrip
          if-no-files-found: warn

  staticAnalysis:
    name: Workflow Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  ${ARCHIVE}" | sha256sum --check --strict -
          tar -xzf "$ARCHIVE" actionlint
          chmod +x actionlint
          ./actionlint --version

      - name: Install zizmor
        env:
          ZIZMOR_VERSION: 1.30.0
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "zizmor==${ZIZMOR_VERSION}"
          zizmor --version

      - name: Run actionlint
        run: |
          set -euo pipefail
          ./actionlint -color

      - name: Check required workflow contexts
        run: python3 scripts/check-workflow-policy.py

      - name: Check workflow policy fixtures
        run: python3 scripts/test-workflow-policy.py

      - name: Check repository policy fixtures
        run: python3 scripts/test_repository_policy.py

      - name: Check issue metadata policy
        run: |
          python3 scripts/test_issue_metadata.py
          node --test scripts/issue-metadata.test.cjs

      - name: Check bounded Gradle retry fixtures
        run: python3 scripts/test_gradle_check_gate.py

      - name: Check DataGrip verifier fixtures
        run: python3 scripts/test_datagrip_verifier.py

      - name: Check Marketplace candidate fixtures
        run: python3 scripts/test_marketplace_candidate.py

      - name: Check Marketplace release fixtures
        run: python3 scripts/test_marketplace_release.py

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zizmor --persona=regular --format=plain .github/workflows

      # Negative control.
      #
      # Both scanners are pointed at a workflow that is known to be invalid
      # (unknown runner label) and known to be unsafe (`write-all` permissions,
      # unpinned action). The step asserts a non-zero exit *and* that the
      # expected rule name appears in the output, so that "the scanner crashed"
      # cannot be mistaken for "the scanner caught it". If either scanner comes
      # back clean, the gate is not trustworthy and this job fails.
      - name: Negative control
        run: |
          set -euo pipefail
          FIXTURE_DIR="$RUNNER_TEMP/negative-control/.github/workflows"
          mkdir -p "$FIXTURE_DIR"
          FIXTURE="$FIXTURE_DIR/unsafe.yml"
          unsafe_key="u""ses:"
          unsafe_action="actions/checkout@v4"
          {
            printf '%s\n' 'name: Deliberately Unsafe'
            printf '%s\n' 'on: push'
            printf '%s\n' 'permissions: write-all'
            printf '%s\n' 'jobs:'
            printf '%s\n' '  unsafe:'
            printf '%s\n' '    runs-on: ubuntu-nonexistent-runner'
            printf '%s\n' '    steps:'
            printf '%s\n' "      - ${unsafe_key} ${unsafe_action}"
          } > "$FIXTURE"

          actionlint_status=0
          actionlint_output=$(./actionlint -no-color "$FIXTURE" 2>&1) || actionlint_status=$?
          if [ "$actionlint_status" -eq 0 ]; then
            echo "::error::actionlint exited 0 on a deliberately invalid workflow; the gate is not fail-closed."
            exit 1
          fi
          if ! printf '%s' "$actionlint_output" | grep -q 'runner-label'; then
            echo "::error::actionlint failed without reporting the expected runner-label finding; it did not actually analyse the fixture."
            printf '%s\n' "$actionlint_output"
            exit 1
          fi

          zizmor_status=0
          zizmor_output=$(zizmor --persona=regular --format=plain --no-progress "$FIXTURE_DIR" 2>&1) || zizmor_status=$?
          if [ "$zizmor_status" -eq 0 ]; then
            echo "::error::zizmor exited 0 on a deliberately unsafe workflow; the gate is not fail-closed."
            exit 1
          fi
          if ! printf '%s' "$zizmor_output" | grep -q 'unpinned-uses'; then
            echo "::error::zizmor failed without reporting the expected unpinned-uses finding; it did not actually analyse the fixture."
            printf '%s\n' "$zizmor_output"
            exit 1
          fi

          echo "Negative control passed: actionlint (exit ${actionlint_status}) and zizmor (exit ${zizmor_status}) both rejected the unsafe workflow."


  dependencyReview:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        if: ${{ needs.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate


  mergeGate:
    name: Merge Gate
    needs: [ build, test, verify, staticAnalysis, dependencyReview ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every merge-gate component to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WORKFLOW_STATIC_ANALYSIS_RESULT: ${{ needs.staticAnalysis.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependencyReview.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "Build=$BUILD_RESULT" \
            "Test=$TEST_RESULT" \
            "Verify plugin=$VERIFY_RESULT" \
            "Workflow Static Analysis=$WORKFLOW_STATIC_ANALYSIS_RESULT" \
            "Dependency Review=$DEPENDENCY_REVIEW_RESULT"
          do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::$name concluded '$result'; Merge Gate remains closed."
              failed=1
            fi
          done
          exit "$failed"

