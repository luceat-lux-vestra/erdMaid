name: Marketplace Release

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: marketplace-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish signed plugin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: jetbrains-marketplace
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Fetch immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove release identity and reviewed-main ancestry
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Stable release tags must be vMAJOR.MINOR.PATCH."
            exit 1
          }
          version="${RELEASE_TAG#v}"
          python3 scripts/marketplace_candidate.py validate-version "$version"

          tag_sha="$(git rev-parse HEAD)"
          [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_sha" origin/main || {
            echo "::error::Release tag is not reachable from reviewed main."
            exit 1
          }

          release_json="$RUNNER_TEMP/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$release_json" >/dev/null

          printf 'version=%s\ncommit=%s\n' "$version" "$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve publication recovery state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release-state.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"

          pending_ids="$(jq -r '.assets[]? | select(.name == "erdmaid-release-identity.json") | .id' "$release_json")"
          published_ids="$(jq -r '.assets[]? | select(.name == "erdmaid-release-published.json") | .id' "$release_json")"
          [ "$(printf '%s\n' "$pending_ids" | sed '/^$/d' | wc -l | tr -d ' ')" -le 1 ]
          [ "$(printf '%s\n' "$published_ids" | sed '/^$/d' | wc -l | tr -d ' ')" -le 1 ]

          published_id="$(printf '%s\n' "$published_ids" | sed -n '1p')"
          pending_id="$(printf '%s\n' "$pending_ids" | sed -n '1p')"

          if [ -n "$published_id" ]; then
            identity="$RUNNER_TEMP/existing-published.json"
            gh api -H 'Accept: application/octet-stream'               "repos/${GITHUB_REPOSITORY}/releases/assets/${published_id}" > "$identity"
            jq -e               --arg tag "$RELEASE_TAG"               --arg version "$RELEASE_VERSION"               --arg commit "$RELEASE_COMMIT" '
                .schema == 1 and
                .publication_state == "published" and
                .tag == $tag and
                .version == $version and
                .commit == $commit and
                (.artifact | endswith("-" + $version + "-signed.zip")) and
                (.artifact_sha256 | test("^[0-9a-f]{64}$"))
              ' "$identity" >/dev/null

            artifact_name="$(jq -r '.artifact' "$identity")"
            expected_sha="$(jq -r '.artifact_sha256' "$identity")"
            asset_ids="$(jq -r --arg name "$artifact_name" '.assets[]? | select(.name == $name) | .id' "$release_json")"
            [ "$(printf '%s\n' "$asset_ids" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1 ] || {
              echo "::error::Published identity must map to exactly one signed GitHub Release asset."
              exit 1
            }
            asset_id="$(printf '%s\n' "$asset_ids" | sed -n '1p')"
            gh api -H 'Accept: application/octet-stream'               "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$RUNNER_TEMP/existing-signed.zip"
            actual_sha="$(sha256sum "$RUNNER_TEMP/existing-signed.zip" | awk '{print $1}')"
            [ "$actual_sha" = "$expected_sha" ] || {
              echo "::error::Published signed asset digest does not match release identity."
              exit 1
            }
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$pending_id" ]; then
            echo "::error::Pending Marketplace publication identity exists; manual recovery is required."
            exit 1
          fi

          orphan_count="$(jq -r --arg suffix "-${RELEASE_VERSION}-signed.zip"             '[.assets[]? | select(.name | endswith($suffix))] | length' "$release_json")"
          [ "$orphan_count" -eq 0 ] || {
            echo "::error::Signed GitHub Release asset exists without a completed publication identity."
            exit 1
          }
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        if: ${{ steps.state.outputs.publish == 'true' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ steps.state.outputs.publish == 'true' }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Build and verify exact Marketplace candidate
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean buildPlugin -PbuildVersion="$RELEASE_VERSION"
          python3 scripts/gradle_check_gate.py check
          python3 scripts/gradle_check_gate.py verifyPlugin
          python3 scripts/datagrip_verifier.py
          python3 scripts/marketplace_candidate.py inspect             --archive "build/distributions/erdMaid-${RELEASE_VERSION}.zip"             --version "$RELEASE_VERSION"             --commit "$RELEASE_COMMIT"             --output build/reports/marketplace-release-candidate.json

      - name: Verify publication credentials
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${PUBLISH_TOKEN:-}" ] || missing+=(PUBLISH_TOKEN)
          [ -n "${CERTIFICATE_CHAIN:-}" ] || missing+=(CERTIFICATE_CHAIN)
          [ -n "${PRIVATE_KEY:-}" ] || missing+=(PRIVATE_KEY)
          [ -n "${PRIVATE_KEY_PASSWORD:-}" ] || missing+=(PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Publication aborted before signing/Marketplace mutation; missing: ${missing[*]}"
            exit 1
          fi

      - name: Sign exact Marketplace artifact
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin -PbuildVersion="$RELEASE_VERSION"

      - name: Verify signed Marketplace artifact
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew verifyPluginSignature -PbuildVersion="$RELEASE_VERSION"

      - name: Capture verified signed artifact
        if: ${{ steps.state.outputs.publish == 'true' }}
        id: signed
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="build/distributions/erdMaid-${RELEASE_VERSION}-signed.zip"
          test -f "$expected"
          mapfile -t signed_archives < <(find build/distributions -maxdepth 1 -type f -name '*-signed.zip' -print)
          [ "${#signed_archives[@]}" -eq 1 ]
          [ "${signed_archives[0]}" = "$expected" ]
          digest="$(sha256sum "$expected" | awk '{print $1}')"
          printf 'path=%s\nname=%s\nsha256=%s\n' "$expected" "$(basename "$expected")" "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest verified signed artifact
        if: ${{ steps.state.outputs.publish == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.signed.outputs.path }}

      - name: Lock publication identity
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_ARTIFACT: ${{ steps.signed.outputs.name }}
          RELEASE_SHA256: ${{ steps.signed.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n             --arg tag "$RELEASE_TAG"             --arg version "$RELEASE_VERSION"             --arg commit "$RELEASE_COMMIT"             --arg artifact "$RELEASE_ARTIFACT"             --arg sha "$RELEASE_SHA256"             '{
              schema: 1,
              publication_state: "pending",
              tag: $tag,
              version: $version,
              commit: $commit,
              artifact: $artifact,
              artifact_sha256: $sha,
              marketplace_channel: "default",
              author_signed: true
            }' > "$RUNNER_TEMP/erdmaid-release-identity.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/erdmaid-release-identity.json"

      - name: Publish verified artifact to JetBrains Marketplace
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -x signPlugin -PbuildVersion="$RELEASE_VERSION"

      - name: Recheck signed artifact identity
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          RELEASE_ARTIFACT: ${{ steps.signed.outputs.path }}
          EXPECTED_SHA256: ${{ steps.signed.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum "$RELEASE_ARTIFACT" | awk '{print $1}')"
          [ "$actual" = "$EXPECTED_SHA256" ]

      - name: Upload verified signed GitHub Release asset
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ARTIFACT: ${{ steps.signed.outputs.path }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ARTIFACT"

      - name: Mark publication complete
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          jq '.publication_state = "published"'             "$RUNNER_TEMP/erdmaid-release-identity.json"             > "$RUNNER_TEMP/erdmaid-release-published.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/erdmaid-release-published.json"
