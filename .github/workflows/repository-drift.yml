# Scheduled authoritative-main drift detection. Missing live fields are failures unless
# repository-policy.json explicitly declares that the read-only GITHUB_TOKEN may redact them.
# Declared redacted repository fields and ruleset bypass_actors remain separate privileged
# merge/exit-gate assertions; their absence here is never treated as proof of the expected value.
#
# This workflow is schedule-only on purpose: trusted-main label maintenance runs on push,
# and a concurrent push audit could race that synchronization and report transient false drift.
name: Repository Drift Audit

on:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  issues: read

concurrency:
  group: repository-drift-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Repository drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Fetch trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run policy unit tests
        run: python3 scripts/test_repository_policy.py
      - name: Read back live repository policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/repository_policy.py audit
