# Exact binary evidence for Track #37 DatabaseTools host boundaries.
name: Host API Evidence

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/host-api-evidence.yml'
      - 'scripts/database_host_api_inventory.py'
      - 'scripts/test_database_host_api_inventory.py'
      - 'scripts/datagrip_host_api_evidence.py'
      - 'scripts/datagrip_verifier.py'
      - 'src/main/kotlin/com/algorist/erdmaid/actions/**'
      - 'src/main/kotlin/com/algorist/erdmaid/host/**'
      - 'src/test/kotlin/com/algorist/erdmaid/actions/**'
      - 'src/test/kotlin/com/algorist/erdmaid/host/**'
  pull_request:
    paths:
      - '.github/workflows/host-api-evidence.yml'
      - 'scripts/database_host_api_inventory.py'
      - 'scripts/test_database_host_api_inventory.py'
      - 'scripts/datagrip_host_api_evidence.py'
      - 'scripts/datagrip_verifier.py'
      - 'src/main/kotlin/com/algorist/erdmaid/actions/**'
      - 'src/main/kotlin/com/algorist/erdmaid/host/**'
      - 'src/test/kotlin/com/algorist/erdmaid/actions/**'
      - 'src/test/kotlin/com/algorist/erdmaid/host/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  idea-host-api-evidence:
    name: IDEA Host API Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Check inventory negative controls
        run: python3 scripts/test_database_host_api_inventory.py

      - name: Resolve exact IDEA DatabaseTools runtime
        run: python3 scripts/gradle_check_gate.py check

      - name: Collect exact IDEA host API evidence
        run: |
          IDE_HOME="$(cat build/reports/hostApiEvidence/idea/idea-home.txt)"
          python3 scripts/database_host_api_inventory.py \
            "$IDE_HOME" \
            build/reports/hostApiEvidence/idea/api-inventory.json

      - name: Upload IDEA API evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idea-host-api-evidence
          path: build/reports/hostApiEvidence/idea
          if-no-files-found: warn

  datagrip-host-api-evidence:
    name: DataGrip Host API Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          large-packages: true

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 25

      - name: Check inventory negative controls
        run: python3 scripts/test_database_host_api_inventory.py

      - name: Collect exact DataGrip host API evidence
        run: python3 scripts/datagrip_host_api_evidence.py

      - name: Upload DataGrip API evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datagrip-host-api-evidence
          path: build/reports/hostApiEvidence/datagrip
          if-no-files-found: warn
