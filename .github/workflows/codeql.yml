name: CodeQL
run-name: CodeQL source ${{ inputs.candidate_sha || github.sha }}

on:
  # Routine PR/push CodeQL is intentionally disabled: full default-branch scans
  # remain weekly and trusted exact-source scans are available on manual dispatch.
  # New automated Marketplace publications require eligible exact-SHA SARIF evidence.
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character protected main ancestor SHA for Marketplace preflight'
        required: true
        type: string
  # The default-branch security alert baseline is refreshed weekly, not on every merge.
  schedule:
    - cron: "47 3 * * 3"

permissions: {}

concurrency:
  group: codeql-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  scan-guard:
    name: CodeQL schedule guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_scan: ${{ steps.decide.outputs.should_scan }}
    steps:
      - name: Decide whether full CodeQL is required
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            echo "Explicit candidate scan: always run full CodeQL."
            exit 0
          fi

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Scheduled source is not an immutable SHA."
            exit 1
          }

          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs?event=schedule&status=success&branch=main&per_page=100")"
          jq -e --arg sha "$GITHUB_SHA" --argjson current "$GITHUB_RUN_ID" '
            .workflow_runs
            | any(
                .id != $current
                and .head_sha == $sha
                and .head_branch == "main"
                and .path == ".github/workflows/codeql.yml"
              )
          ' <<<"$runs" >/dev/null && {
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            echo "Protected main SHA $GITHUB_SHA already has a successful scheduled CodeQL run; skipping unchanged full scan."
            exit 0
          }

          echo "should_scan=true" >> "$GITHUB_OUTPUT"
          echo "No successful scheduled CodeQL run exists for protected main SHA $GITHUB_SHA; running full scan."

  analyze:
    needs: scan-guard
    if: needs.scan-guard.outputs.should_scan == 'true'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: autobuild
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: Verify exact protected-main candidate
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Require full immutable SHA"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Only reviewed main may produce evidence"; exit 1; }
          case "$GITHUB_EVENT_NAME" in workflow_dispatch|schedule) ;; *) exit 1 ;; esac
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            [ "$GITHUB_SHA" = "$EXPECTED_SHA" ] || { echo "::error::Scheduled SHA mismatch"; exit 1; }
          fi
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          relation="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${remote_main}" --jq '.status')"
          case "$relation" in ahead|identical) ;; *) echo "::error::Candidate is not in protected main history"; exit 1 ;; esac

      - name: Fetch exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify protected-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" FETCH_HEAD

      - name: Record analyzed source
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          source = os.environ["EXPECTED_SHA"]
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source != checkout:
              raise SystemExit("Analyzed checkout diverges from selected SHA")
          identity = {
              "schema": 1, "candidate_sha": source, "checkout_sha": checkout,
              "event_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "language": os.environ["CODEQL_LANGUAGE"],
          }
          Path(os.environ["RUNNER_TEMP"], "source-identity.json").write_text(
              json.dumps(identity, sort_keys=True), encoding="utf-8")
          PY

      - name: Setup Java 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 25

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ github.event_name == 'workflow_dispatch' && 'never' || 'always' }}
          output: ${{ runner.temp }}/release-codeql-${{ matrix.language }}

      - name: Retain exact-source raw SARIF
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 90

      - name: Retain verified source provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-source-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ runner.temp }}/source-identity.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed on invalid or High/Critical security evidence
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          python3 scripts/release_codeql_verdict.py \
            --sarif-dir "$SARIF_DIR" \
            --language "${{ matrix.language }}" \
            --candidate-sha "$EXPECTED_SHA"
      - name: Verify protected-main ancestry after analysis
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" FETCH_HEAD
