# Trusted, narrowly-triggered cache producer for first-attempt PR validation.
# This workflow is NOT a repeat of product tests, Plugin Verifier, CodeQL, or Merge Gate.
# It never publishes release artifacts and never mutates repository contents.
name: Seed Gradle Cache

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/gradle-cache-seed.yml'
      - '.github/workflows/build.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-cache-seed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    name: Seed JDK 25 Gradle Cache
    # workflow_dispatch on other refs must not write branch-private caches.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Fetch exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact main checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 25

      - name: Setup default-branch Gradle cache writer
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      # Resolve and compile the build/test toolchains, but DO NOT execute
      # product tests, Plugin Verifier, CodeQL, or publication a second time.
      # Default-branch Gradle User Home entries are readable by future PRs.
      - name: Prime Gradle dependency and compiler caches
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon buildPlugin compileIntegrationTestKotlin
