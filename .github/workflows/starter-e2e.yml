name: Starter E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  starter-e2e:
    name: Starter E2E
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      # Both Gradle invocations must address the same distribution archive. The default
      # timestamp version changes per Gradle process and would invalidate artifact identity.
      ORG_GRADLE_PROJECT_buildVersion: 0.0.0-e2e-${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # PR validation must never publish Gradle User Home state. Dependency-changing
          # Dependabot PRs also bypass restored caches so stale/negative resolution metadata
          # cannot mask whether the updated graph is actually downloadable.
          cache-read-only: true
          cache-disabled: ${{ startsWith(github.head_ref, 'dependabot/') }}

      - name: Build exact plugin artifact
        shell: bash
        run: |
          set -euo pipefail
          # Keep the exact failure output in the diagnostics artifact as well as job logs.
          ./gradlew buildPlugin 2>&1 | tee starter-e2e-build.log
          tested_commit="$(git rev-parse HEAD)"
          test "$tested_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one plugin distribution, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          artifact="${archives[0]}"
          {
            echo "tested_commit=$tested_commit"
            echo "plugin_artifact=$artifact"
            echo "plugin_sha256=$(sha256sum "$artifact" | awk '{print $1}')"
            echo "ide_release=2026.3"
          } | tee starter-e2e-artifact-manifest.txt

      - name: Run IDEA 2026.3 Database export E2E
        shell: bash
        run: |
          set -o pipefail
          ./gradlew integrationTest --stacktrace 2>&1 | tee starter-e2e.log

      - name: Upload Starter E2E artifact identity
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starter-e2e-idea-2026.3-artifact-identity
          path: starter-e2e-artifact-manifest.txt
          if-no-files-found: error

      - name: Upload Starter E2E failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starter-e2e-failure-diagnostics
          path: |
            starter-e2e-build.log
            starter-e2e.log
            build/reports/tests/integrationTest
            build/test-results/integrationTest
            out/ide-tests/tests
          if-no-files-found: warn
